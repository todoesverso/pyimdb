<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IMDb Search</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>IMDb Search</h1>
  <p class="m"><a href="/sql">Advanced: run your own SQL queries &rarr;</a></p>
  <form id="search-form" role="search">
    <label class="search-label" for="q">Search titles</label>
    <input id="q" type="search" placeholder="Search titles..." autocomplete="off" autofocus aria-controls="out">
  </form>
  <p id="search-status" class="search-status m" role="status" aria-live="polite"></p>
  <main id="out" aria-live="polite"></main>
  <script src="/static/search.js"></script>
  <footer class="m" id="info"></footer>
  <script src="/static/info.js"></script>
</body>
</html>
