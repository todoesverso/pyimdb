proxy_cache_path /var/cache/nginx
    keys_zone=imdb_api:10m
    max_size=64m
    inactive=10m
    use_temp_path=off;

map $upstream_cache_status $log_cached_request {
    default 0;
    HIT 1;
}

log_format cache_json escape=json
    '{"timestamp":"$time_iso8601","request_id":"$request_id",'
    '"client_ip":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"duration_s":$request_time,'
    '"response_bytes":$body_bytes_sent,"cache":"$upstream_cache_status",'
    '"user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:8000;

    access_log /dev/stdout cache_json if=$log_cached_request;
    error_log /dev/stderr warn;

    location = /healthz {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://$app_upstream$request_uri;
    }

    location = /api/query {
        client_max_body_size 16k;
        client_body_buffer_size 16k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_request_buffering on;
        proxy_pass http://$app_upstream$request_uri;

        proxy_cache imdb_api;
        proxy_cache_methods GET HEAD POST;
        proxy_cache_key "$request_method|$host|$remote_addr|$request_uri|$request_body";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization $upstream_http_set_cookie;

        add_header X-Request-ID $request_id always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ ^/api/(search|title/[^/]+|person/[^/]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_pass http://$app_upstream$request_uri;

        proxy_cache imdb_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_method|$host|$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization $upstream_http_set_cookie;

        add_header X-Request-ID $request_id always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://$app_upstream$request_uri;
    }
}