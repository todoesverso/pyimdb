name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies and Ruff
        run: python -m pip install --disable-pip-version-check -r requirements.txt ruff

      - name: Lint Python
        run: ruff check --select E4,E7,E9,F app.py pyimdb.py

      - name: Compile and import Python modules
        run: |
          python -m py_compile app.py pyimdb.py
          python -c "import app, pyimdb"

      - name: Check JavaScript syntax
        run: |
          node --check static/search.js
          node --check static/sql.js
          node --check static/info.js

      - name: Validate SQL examples JSON
        run: python -m json.tool static/examples.json > /dev/null

      - name: Validate Docker Compose configuration
        env:
          TUNNEL_TOKEN: ci-placeholder
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag imdb-web:ci .