services:
  app:
    build: .
    restart: unless-stopped
    environment:
      IMDB_DB: /data/imdb.db
    volumes:
      - ./data:/data:ro              # put imdb.db in ./data/
    expose:
      - "8000"
    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=512m               # SQLite temp files for sorts/joins
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=1777
      - /var/run:size=1m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # One-off job: builds the full-text search index inside imdb.db
  #   docker compose --profile tools run --rm build-search
  build-search:
    build: .
    profiles: ["tools"]
    user: root
    command: ["python", "app.py", "--build-search"]
    environment:
      IMDB_DB: /data/imdb.db
    volumes:
      - ./data:/data
